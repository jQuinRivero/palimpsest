name: Bug report
description: Report something that is broken or surprising in palimpsest
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please avoid attaching manuscripts unless they are public domain, project-authored, or you have permission to share them.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: witness-format
    attributes:
      label: Witness format
      description: Which format triggered the problem?
      multiple: true
      options:
        - .txt
        - .md / .markdown
        - .docx
        - .pdf
        - Multiple formats
        - Not sure
    validations:
      required: true
  - type: input
    id: error-code
    attributes:
      label: Error code shown
      description: For example UNSUPPORTED_FORMAT, OCR_REQUIRED, FILE_TOO_LARGE, EMPTY_DOCUMENT, or MALFORMED_DOCUMENT.
      placeholder: OCR_REQUIRED
  - type: dropdown
    id: manuscripts-shareable
    attributes:
      label: Can the manuscripts be shared with maintainers?
      options:
        - Yes, they are public domain or project-authored
        - Yes, privately only
        - No
        - I can make a reduced reproduction
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the smallest steps that reproduce the problem.
      placeholder: |
        1. Upload Manuscript A as ...
        2. Upload Manuscript B as ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Browser and operating system
      description: Include browser/version, OS, and whether you ran locally or from a deployed URL.
      placeholder: Chrome 125 on Windows 11, local dev server
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, logs, or reduced public-domain samples are welcome.
