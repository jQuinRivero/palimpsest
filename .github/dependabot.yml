version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # pyproject uses lower bounds, while uv.lock chooses the concrete tested
    # versions. Raising a floor from 6.125 to whatever is newest is not an
    # update — it only excludes environments that still satisfy the contract.
    versioning-strategy: increase-if-necessary
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Keep compatible ranges stable and update the lockfile inside them.
    versioning-strategy: increase-if-necessary
    ignore:
      # The current Next.js/openapi-typescript stack is on ESLint 9 and
      # TypeScript 5. Dependabot's first major PRs proved the boundary:
      # ESLint 10 crashes in the config stack, and openapi-typescript 7.13
      # declares TypeScript ^5.x. Revisit when those upstreams move.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # Node 20 is the documented and container-verified minimum runtime.
      # Types for Node 26 would make successful type-checking say nothing
      # about that supported environment.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # GitHub's public runners can install these, but the approved CFS npm
      # feed used by this project's managed development devices does not yet
      # serve 16.3.0. Ignore only that release; the next one is allowed to
      # prove the feed has caught up.
      - dependency-name: next
        versions:
          - "16.3.0"
      - dependency-name: eslint-config-next
        versions:
          - "16.3.0"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
