name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger. Added after a GitHub Actions outage swallowed two pushes:
  # runs are not created while Actions is down and are never replayed when it
  # returns, so main sat unverified with no way to ask for a run short of
  # committing something that did not need committing.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # UV_PYTHON is read by uv directly, in every job that installs the backend.
  # Without it uv takes whatever `python3` the runner image happens to ship —
  # 3.12.3 today — so the version was decided by GitHub's image rather than by
  # this file, and would change silently the day that image did.
  UV_PYTHON: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject declares requires-python = ">=3.12". Testing only 3.12
        # made that a claim rather than a promise: anyone on 3.13 is inside
        # the declared range and outside everything we run.
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: backend
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # scripts/ is included: check_licences.py runs in this very workflow, so
      # it is load-bearing code, and code CI never lints is code that rots.
      - name: Lint
        run: uv run ruff check app tests scripts

      - name: Format check
        run: uv run ruff format --check app tests scripts

      - name: Type check
        run: uv run mypy app

      # The repo is Apache-2.0, so strong copyleft is disqualifying —
      # transitively as well as directly. See ADR-0002.
      - name: Check dependency licences
        run: uv run python scripts/check_licences.py

      - name: Test
        run: uv run pytest tests -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend dependency licences
        run: python3 ../backend/scripts/check_licences.py --npm-only

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  contract:
    name: Schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Start API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      # The committed TypeScript types are generated from the OpenAPI schema.
      # Regenerating and diffing makes Pydantic/TypeScript drift impossible
      # rather than merely discouraged — a drift here is a silent rendering
      # bug, not a loud failure.
      - name: Check generated types are current
        working-directory: frontend
        run: npm run check:types-drift

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: backend
        # The window threshold is lowered so the end-to-end suite can exercise
        # a truncated comparison with a few hundred blocks rather than the few
        # thousand the production default needs. Playwright sets the same
        # values when it starts the API itself; the two must agree, or
        # windowing.spec fails its own premise check. See playwright.config.ts.
        env:
          PALIMPSEST_COMPARISON_WINDOW_BLOCK_THRESHOLD: "25"
          PALIMPSEST_DEFAULT_BLOCK_PAGE_LIMIT: "10"
          PALIMPSEST_RATE_LIMIT_ENABLED: "false"
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
