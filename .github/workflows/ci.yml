name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # StrEnum (docs/05-data-schema.md) requires 3.11+; the project pins 3.12.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: Lint
        run: uv run ruff check app tests

      - name: Format check
        run: uv run ruff format --check app tests

      - name: Type check
        run: uv run mypy app

      # The repo is Apache-2.0, so strong copyleft is disqualifying —
      # transitively as well as directly. See ADR-0002.
      - name: Check dependency licences
        run: uv run python scripts/check_licences.py

      - name: Test
        run: uv run pytest tests -q --cov=app --cov-report=term-missing

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

  contract:
    name: Schema contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Start API
        working-directory: backend
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      # The committed TypeScript types are generated from the OpenAPI schema.
      # Regenerating and diffing makes Pydantic/TypeScript drift impossible
      # rather than merely discouraged — a drift here is a silent rendering
      # bug, not a loud failure.
      - name: Check generated types are current
        working-directory: frontend
        run: npm run check:types-drift

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: uv sync --all-groups --frozen

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start API
        working-directory: backend
        # The window threshold is lowered so the end-to-end suite can exercise
        # a truncated comparison with a few hundred blocks rather than the few
        # thousand the production default needs. Playwright sets the same
        # values when it starts the API itself; the two must agree, or
        # windowing.spec fails its own premise check. See playwright.config.ts.
        env:
          PALIMPSEST_COMPARISON_WINDOW_BLOCK_THRESHOLD: "25"
          PALIMPSEST_DEFAULT_BLOCK_PAGE_LIMIT: "10"
          PALIMPSEST_RATE_LIMIT_ENABLED: "false"
        run: |
          uv run uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run end-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
