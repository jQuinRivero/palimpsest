name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check docs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: docs-site/uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install documentation toolchain
        run: uv --directory docs-site sync --frozen

      - name: Build HTML
        run: uv --directory docs-site run jupyter-book build .

      - name: Check links into the normative specification
        run: uv --directory docs-site run python check_repository_links.py

      - name: Check links
        run: uv --directory docs-site run jupyter-book build . --builder linkcheck

      - name: Upload Pages artifact
        if: github.repository_visibility == 'public'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
