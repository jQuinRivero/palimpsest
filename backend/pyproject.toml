[project]
name = "palimpsest"
version = "0.1.0"
description = "Read the difference between two versions of a literary text."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "jQuinRivero" }]
keywords = [
    "diff",
    "collation",
    "textual-criticism",
    "digital-humanities",
    "manuscript",
    "tei",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Text Processing :: Markup :: XML",
]
# StrEnum (docs/05-data-schema.md) requires Python 3.11+.
# Lowering this pin means rewriting every enum as `class X(str, Enum)`.
requires-python = ">=3.12"

# Versions are floors, not locks — see docs/README.md.
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "diff-match-patch>=20241021",
    "rapidfuzz>=3.13.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.20",
    "python-docx>=1.2.0",
    "pdfplumber>=0.11",
    "pypdf>=6.15.0",
]

[project.urls]
Homepage = "https://github.com/jQuinRivero/palimpsest"
Repository = "https://github.com/jQuinRivero/palimpsest"
Issues = "https://github.com/jQuinRivero/palimpsest/issues"
Changelog = "https://github.com/jQuinRivero/palimpsest/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.125.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",
]
# N818 wants an "Error" suffix on exceptions. InvariantViolation reads better
# at the call site and the spec calls these "invariants", not "errors".
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
# Depends()/File()/Form()/Query() in argument defaults is the FastAPI idiom,
# not the mutable-default bug B008 exists to catch.
"app/api/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["diff_match_patch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
