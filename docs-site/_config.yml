title: palimpsest
author: jQuinRivero
copyright: "2026"
logo: ""
only_build_toc_files: true
exclude_patterns:
  - "_build/**"
  - ".venv/**"

execute:
  execute_notebooks: "off"

repository:
  url: https://github.com/jQuinRivero/palimpsest
  branch: main
  path_to_book: docs-site

html:
  use_repository_button: true
  use_issues_button: true
  use_edit_page_button: true
  home_page_in_navbar: true

parse:
  myst_enable_extensions:
    - colon_fence
    - deflist

sphinx:
  extra_extensions:
    - sphinxcontrib.mermaid
  config:
    # Canonical URLs and the social-card tags need to know where the site
    # actually lives. Without it Sphinx emits no canonical link at all.
    # generate_sitemap.py is given the same value, so the two cannot drift.
    html_baseurl: "https://jquinrivero.github.io/palimpsest/"
    templates_path: ["_templates"]
    html_extra_path: ["_extra"]
    suppress_warnings: []
    nitpicky: true
    mermaid_version: "10.9.1"
    mermaid_init_js: "{startOnLoad:true, theme:'neutral'}"
    linkcheck_timeout: 20
    linkcheck_retries: 3
    linkcheck_report_timeouts_as_broken: false
    linkcheck_anchors: true
    linkcheck_ignore:
      - "http://localhost:3000/?"
      - "http://127\\.0\\.0\\.1:8000/?"
